# Запуск: docker compose up -d --build   (из папки проекта, rootless Docker)
# Портов наружу нет: бот сам опрашивает Telegram (TELEGRAM_MODE=polling).

services:
  telepathy:
    build: .
    image: telepathy:latest
    container_name: telepathy
    restart: unless-stopped
    env_file: .env
    environment:
      # Пути внутри контейнера важнее значений из .env.
      DATA_DIR: /data
      GIGACHAT_CA_BUNDLE_FILE: /certs/russian_trusted_root_ca.pem
    volumes:
      - telepathy_data:/data
      # Корневой сертификат Минцифры для TLS к GigaChat — только чтение.
      - ${GIGACHAT_CA_HOST_FILE:-/home/agent/certs/Russian_Trusted_Root_CA.cer}:/certs/russian_trusted_root_ca.pem:ro
    # Модель e5-small в fp32 + torch ≈ 0.8 ГБ RSS. Лимит — чтобы при перерасходе
    # OOM убил только этот контейнер, а не lab_manager.
    mem_limit: 1g
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "telepathy.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Первый запуск скачивает модель (~470 МБ).
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  telepathy_data:
