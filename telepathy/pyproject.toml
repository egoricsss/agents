[project]
name = "telepathy"
version = "0.1.0"
description = "Telegram-бот «Телепатия» для пары: сообщает, когда мысли партнёров совпали по смыслу"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31",
    "aiosqlite>=0.22.1",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pydantic-ai-slim[openai]>=2.57.0",
    "pydantic-settings>=2.6",
    "sentence-transformers>=5.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "sqlite-vec>=0.1.6",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telepathy"]

# torch только CPU-сборкой: с PyPI он тянет CUDA (~3 ГБ), а VPS без GPU и с малым диском.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "ANN",      # type annotations everywhere
    "S",        # bandit (security)
    "RUF",
]
ignore = ["RUF001", "RUF002", "RUF003"]  # cyrillic in strings/comments is intended

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: тесты с реальной моделью эмбеддингов / LLM (запускаются вручную: pytest -m live)",
]
